<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM Racing // MTB Suspension Tuner</title>
    <link rel="icon" type="image/png" href="https://png.pngtree.com/png-vector/20240628/ourmid/pngtree-mountain-bike-silhouette-mtb-png-image_12906095.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wmcharcoal: '#0b0f17',
                        wmdark: '#121824',
                        wmblue: '#2563eb',
                        wmneon: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }
    </style>
</head>
<body class="bg-[#0b0f17] text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">

    <div class="w-full max-w-[640px] min-h-[720px] bg-[#121824] rounded-2xl shadow-2xl border border-slate-800 p-6 flex flex-col justify-between relative overflow-hidden">
        <!-- Top accent line matching core site -->
        <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-blue-600 via-sky-400 to-blue-600"></div>
        
        <!-- Header Controls -->
        <div class="flex justify-between items-center mb-6 pt-2">
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold bg-blue-600/20 text-sky-400 border border-sky-500/30 px-2 py-0.5 rounded tracking-wider">WM RACING TUNER</span>
            </div>
            <button onclick="handleResetApp()" class="text-[10px] uppercase tracking-wider text-slate-500 hover:text-red-400 transition-colors">
                Reset App Data
            </button>
        </div>

        <!-- Main Dynamic Content Container -->
        <div id="app-content" class="flex-1 flex flex-col justify-between">
            <!-- App views generate here dynamically -->
        </div>

        <!-- Footer -->
        <div class="mt-6 pt-4 border-t border-slate-800/60 flex justify-between items-center text-[10px] text-slate-500 tracking-tight">
            <span>WM RACING SUSPENSION LAB</span>
            <span>© 2026 WM RACING</span>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "wm_racing_tuner_db_v4";
        
        let user_data = {
            onboarding_complete: false,
            age: "24",
            weight_value: 75,
            weight_unit: "kg",
            bikes: []
        };

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    user_data = JSON.parse(stored);
                } catch (e) {
                    console.error("Error reading stored data.", e);
                }
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user_data));
        }

        function renderContainer(htmlContent) {
            document.getElementById('app-content').innerHTML = htmlContent;
        }

        function showOnboardingPage() {
            let ageOptions = "";
            for (let i = 5; i <= 90; i++) {
                ageOptions += `<option value="${i}" ${i === 24 ? 'selected' : ''}>${i}</option>`;
            }

            let weightOptions = "";
            for (let i = 30; i <= 160; i++) {
                weightOptions += `<option value="${i}" ${i === 75 ? 'selected' : ''}>${i}</option>`;
            }

            const html = `
                <div class="flex-1 flex flex-col justify-center py-6">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-black tracking-tight text-white uppercase">Suspension Tuner Setup</h2>
                        <p class="text-xs text-sky-400 mt-1">Enter your riding weight to calculate base settings</p>
                    </div>
                    
                    <div class="space-y-5 max-w-md mx-auto w-full bg-slate-900/50 p-5 rounded-xl border border-slate-800/80">
                        <div>
                            <label class="block text-xs uppercase tracking-wider font-semibold mb-1.5 text-slate-400">Rider Age:</label>
                            <select id="onboard-age" class="w-full rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-2 text-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">${ageOptions}</select>
                        </div>

                        <div>
                            <label class="block text-xs uppercase tracking-wider font-semibold mb-1.5 text-slate-400">Rider Weight (with riding gear on):</label>
                            <div class="flex gap-2">
                                <select id="onboard-weight" class="flex-1 rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-2 text-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">${weightOptions}</select>
                                <select id="onboard-unit" class="w-24 rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-2 text-white focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <option value="kg">kg</option>
                                    <option value="lbs">lbs</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pt-4">
                    <button onclick="handleOnboardingSubmit()" class="w-full bg-blue-600 hover:bg-blue-700 text-white uppercase tracking-wider font-bold py-3 px-4 rounded-lg transition-all duration-150 shadow-lg shadow-blue-900/20 active:translate-y-px">
                        Save and Continue
                    </button>
                </div>
            `;
            renderContainer(html);
        }

        function showEditProfilePage() {
            let ageOptions = "";
            for (let i = 5; i <= 90; i++) {
                ageOptions += `<option value="${i}" ${user_data.age == i ? 'selected' : ''}>${i}</option>`;
            }

            let weightOptions = "";
            for (let i = 30; i <= 160; i++) {
                weightOptions += `<option value="${i}" ${user_data.weight_value == i ? 'selected' : ''}>${i}</option>`;
            }

            const html = `
                <div class="flex-1 flex flex-col justify-center py-4">
                    <h2 class="text-xl font-bold uppercase tracking-wider mb-6 text-white text-center">Edit Rider Settings</h2>
                    
                    <div class="space-y-5 max-w-md mx-auto w-full bg-slate-900/50 p-5 rounded-xl border border-slate-800">
                        <div>
                            <label class="block text-xs uppercase text-slate-400 font-medium mb-1.5">Rider Age:</label>
                            <select id="edit-age" class="w-full rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-2 text-white focus:border-blue-500 focus:outline-none">${ageOptions}</select>
                        </div>

                        <div>
                            <label class="block text-xs uppercase text-slate-400 font-medium mb-1.5">Rider Weight:</label>
                            <div class="flex gap-2">
                                <select id="edit-weight" class="flex-1 rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-2 text-white focus:border-blue-500 focus:outline-none">${weightOptions}</select>
                                <select id="edit-unit" class="w-24 rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
                                    <option value="kg" ${user_data.weight_unit === 'kg' ? 'selected' : ''}>kg</option>
                                    <option value="lbs" ${user_data.weight_unit === 'lbs' ? 'selected' : ''}>lbs</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="showHomePage()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold uppercase tracking-wider py-2.5 px-4 rounded-lg transition-colors border border-slate-700 text-sm">Cancel</button>
                    <button onclick="handleSaveProfileSubmit()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold uppercase tracking-wider py-2.5 px-4 rounded-lg transition-colors text-sm">Save Changes</button>
                </div>
            `;
            renderContainer(html);
        }

        function showHomePage() {
            let bikesHTML = "";
            
            if (!user_data.bikes || user_data.bikes.length === 0) {
                bikesHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-center border border-dashed border-slate-800 rounded-xl bg-slate-900/20">
                        <p class="text-sm italic text-slate-500">No bikes added to your garage yet.</p>
                    </div>
                `;
            } else {
                bikesHTML = `<div class="space-y-3">`;
                user_data.bikes.forEach((bike, index) => {
                    bikesHTML += `
                        <div class="flex items-center justify-between p-4 bg-slate-900/60 rounded-xl border border-slate-800 hover:border-slate-700 transition-all duration-150">
                            <div onclick="showTuningDetailPage(${index})" class="flex items-center gap-4 flex-1 cursor-pointer">
                                <div class="w-16 h-12 bg-slate-950 rounded-lg border border-slate-800 flex items-center justify-center overflow-hidden flex-shrink-0">
                                    ${bike.image_data ? `<img src="${bike.image_data}" class="w-full h-full object-cover">` : `<span class="text-[9px] uppercase tracking-wider font-mono text-slate-600">No Photo</span>`}
                                </div>
                                <div>
                                    <h4 class="font-bold text-white text-sm tracking-tight">${bike.name}</h4>
                                    <p class="text-xs text-sky-400 font-mono mt-0.5">${bike.fork_brand} // ${bike.shock_medium ? bike.shock_medium.toUpperCase() : bike.frame_type} // ${bike.riding_style}</p>
                                </div>
                            </div>
                            <button onclick="handleDeleteBike(${index})" class="text-slate-500 hover:text-red-400 font-bold w-8 h-8 rounded-lg flex items-center justify-center transition-colors ml-2">✕</button>
                        </div>
                    `;
                });
                bikesHTML += `</div>`;
            }

            const html = `
                <div class="flex flex-col h-full flex-1 justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <div>
                                <h3 class="text-lg font-black tracking-tight text-white uppercase">Your Garage</h3>
                                <p class="text-xs text-slate-500">Bikes added: ${user_data.bikes ? user_data.bikes.length : 0}</p>
                            </div>
                            <button onclick="showEditProfilePage()" class="text-xs border border-blue-500/30 hover:border-blue-500 text-sky-400 bg-blue-950/20 font-medium px-3 py-1.5 rounded-lg transition-colors">
                                Edit Weight/Age
                            </button>
                        </div>
                        
                        <div class="overflow-y-auto max-h-[380px] pr-1 mb-4">
                            ${bikesHTML}
                        </div>
                    </div>
                    
                    <div class="pt-4">
                        <button onclick="showAddBikePage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold uppercase tracking-wider py-3.5 px-4 rounded-lg shadow-xl shadow-blue-950/40 transition-all border border-blue-500/20">
                            + Add New Bike Setup
                        </button>
                    </div>
                </div>
            `;
            renderContainer(html);
        }

        function showAddBikePage() {
            const html = `
                <div class="flex-1 flex flex-col justify-center overflow-y-auto max-h-[520px] pr-1">
                    <h2 class="text-lg font-bold uppercase tracking-wider text-center mb-5 text-white">Add Bike Setup</h2>
                    
                    <div class="space-y-4 max-w-md mx-auto w-full bg-slate-900/40 p-4 rounded-xl border border-slate-800">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 font-medium mb-1">Bike Photo (Optional):</label>
                            <input type="file" id="bike-image" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border file:border-slate-700 file:text-xs file:font-semibold file:bg-[#0b0f17] file:text-slate-300 hover:file:bg-slate-800">
                        </div>

                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 font-medium mb-1">Bike Name / Model:</label>
                            <input type="text" id="bike-name" placeholder="e.g., My Bike, My DH Preset" class="w-full text-sm rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-1.5 text-white focus:border-blue-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 font-medium mb-1">Riding Terrain / Style:</label>
                            <select id="bike-style" class="w-full text-sm rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-1.5 text-white focus:border-blue-500 focus:outline-none">
                                <option value="General Trails">General Trails</option>
                                <option value="Soft Trails">Soft Trails</option>
                                <option value="Jumps">Jumps</option>
                                <option value="Fast Downhill">Fast Downhill</option>
                                <option value="Dirt Jump">Dirt Jump</option>
                                <option value="Enduro">Enduro</option>
                                <option value="Freeride">Freeride</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 font-medium mb-1">Fork Brand:</label>
                            <select id="bike-fork" class="w-full text-sm rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-1.5 text-white focus:border-blue-500 focus:outline-none">
                                <option value="Fox">Fox</option>
                                <option value="RockShox">RockShox</option>
                                <option value="Ohlins">Ohlins</option>
                                <option value="Marzocchi">Marzocchi</option>
                                <option value="Formula">Formula</option>
                                <option value="DVO">DVO</option>
                                <option value="EXT">EXT</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 font-medium mb-1.5">Frame Setup:</label>
                            <div class="flex gap-2 p-1 bg-[#0b0f17] border border-slate-800 rounded-lg">
                                <button type="button" id="btn-hardtail" onclick="toggleShockField('Hardtail')" class="flex-1 py-1 text-xs font-semibold rounded-md transition-colors bg-blue-600 text-white shadow">Hardtail</button>
                                <button type="button" id="btn-fullsusp" onclick="toggleShockField('Full Suspension')" class="flex-1 py-1 text-xs font-semibold rounded-md transition-colors text-slate-400">Full Suspension</button>
                            </div>
                            <input type="hidden" id="bike-frame" value="Hardtail">
                        </div>

                        <div id="shock-brand-wrapper" class="hidden space-y-3 pt-1 border-t border-slate-800/50">
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-slate-400 font-medium mb-1">Rear Shock Type:</label>
                                <select id="bike-shock-medium" onchange="toggleCoilInputs()" class="w-full text-sm rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-1.5 text-white focus:border-blue-500 focus:outline-none">
                                    <option value="air">Air Shock</option>
                                    <option value="coil">Coil Shock</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs uppercase tracking-wider text-slate-400 font-medium mb-1">Rear Shock Brand:</label>
                                <select id="bike-shock" class="w-full text-sm rounded-lg border border-slate-800 bg-[#0b0f17] px-3 py-1.5 text-white focus:border-blue-500 focus:outline-none">
                                    <option value="Fox">Fox</option>
                                    <option value="RockShox">RockShox</option>
                                    <option value="Ohlins">Ohlins</option>
                                    <option value="Marzocchi">Marzocchi</option>
                                    <option value="Cane Creek">Cane Creek</option>
                                    <option value="DVO">DVO</option>
                                    <option value="EXT">EXT</option>
                                </select>
                            </div>

                            <div id="coil-dimensions-box" class="hidden grid grid-cols-2 gap-2 bg-[#0b0f17] p-2 rounded-lg border border-slate-850">
                                <div>
                                    <label class="block text-[10px] uppercase text-slate-400 font-mono mb-0.5">Rear Wheel Travel (mm):</label>
                                    <input type="number" id="bike-travel" value="160" class="w-full text-xs rounded border border-slate-800 bg-slate-900 px-2 py-1 text-white">
                                </div>
                                <div>
                                    <label class="block text-[10px] uppercase text-slate-400 font-mono mb-0.5">Shock Stroke Length (mm):</label>
                                    <input type="number" id="bike-stroke" value="65" class="w-full text-xs rounded border border-slate-800 bg-slate-900 px-2 py-1 text-white">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="showHomePage()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold uppercase tracking-wider py-2 px-4 rounded-lg text-xs border border-slate-700">Cancel</button>
                    <button onclick="handleCreateBikeSubmit()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold uppercase tracking-wider py-2 px-4 rounded-lg text-xs">Save Bike</button>
                </div>
            `;
            renderContainer(html);
        }

        function toggleShockField(selection) {
            document.getElementById('bike-frame').value = selection;
            const shockWrapper = document.getElementById('shock-brand-wrapper');
            const btnHardtail = document.getElementById('btn-hardtail');
            const btnFullSusp = document.getElementById('btn-fullsusp');
            
            if (selection === "Full Suspension") {
                shockWrapper.classList.remove('hidden');
                btnFullSusp.className = "flex-1 py-1 text-xs font-semibold rounded-md transition-colors bg-blue-600 text-white shadow";
                btnHardtail.className = "flex-1 py-1 text-xs font-semibold rounded-md transition-colors text-slate-500";
                toggleCoilInputs();
            } else {
                shockWrapper.classList.add('hidden');
                btnHardtail.className = "flex-1 py-1 text-xs font-semibold rounded-md transition-colors bg-blue-600 text-white shadow";
                btnFullSusp.className = "flex-1 py-1 text-xs font-semibold rounded-md transition-colors text-slate-500";
            }
        }

        function toggleCoilInputs() {
            const medium = document.getElementById('bike-shock-medium').value;
            const coilBox = document.getElementById('coil-dimensions-box');
            if (medium === 'coil') {
                coilBox.classList.remove('hidden');
            } else {
                coilBox.classList.add('hidden');
            }
        }

        function showTuningDetailPage(bikeIndex) {
            const bike = user_data.bikes[bikeIndex];
            let weight = user_data.weight_value;
            if (user_data.weight_unit === "lbs") {
                weight = weight * 0.453592;
            }
            
            const style = bike.riding_style;
            let fork_psi = 0;
            let fork_rebound = 0;
            const brand_fork = bike.fork_brand;
            
            if (brand_fork.includes("Fox")) {
                fork_psi = Math.floor(weight * 1.06);
                fork_rebound = 7;
            } else if (brand_fork.includes("RockShox")) {
                fork_psi = Math.floor(weight * 0.96);
                fork_rebound = 6;
            } else if (brand_fork.includes("Ohlins")) {
                fork_psi = Math.floor(weight * 1.18);
                fork_rebound = 11;
            } else if (brand_fork.includes("EXT") || brand_fork.includes("Formula")) {
                fork_psi = Math.floor(weight * 0.88);
                fork_rebound = 9;
            } else {
                fork_psi = Math.floor(weight * 1.05);
                fork_rebound = 8;
            }
            
            if (style === "Soft Trails") {
                fork_psi -= 7;
                fork_rebound += 1;
            } else if (style === "Jumps") {
                fork_psi += 12;
                fork_rebound -= 1;
            } else if (style === "Fast Downhill") {
                fork_psi += 6;
                fork_rebound -= 1;
            } else if (style === "Dirt Jump") {
                fork_psi = Math.max(fork_psi + 28, 145);
                fork_rebound = Math.max(fork_rebound - 3, 2);
            } else if (style === "Enduro") {
                fork_psi += 3;
            }
            
            let fork_bars = (fork_psi * 0.0689476).toFixed(2);

            let shockHTML = "";
            if (bike.frame_type === "Full Suspension") {
                const isCoil = bike.shock_medium === "coil";
                
                if (!isCoil) {
                    let shock_psi = 0;
                    let shock_rebound = 0;
                    const brand_shock = bike.shock_brand;
                    
                    if (brand_shock.includes("Fox")) {
                        shock_psi = Math.floor(weight * 2.75);
                        shock_rebound = 7;
                    } else if (brand_shock.includes("RockShox")) {
                        shock_psi = Math.floor(weight * 2.88);
                        shock_rebound = 6;
                    } else if (brand_shock.includes("Ohlins") || brand_shock.includes("EXT")) {
                        shock_psi = Math.floor(weight * 2.45);
                        shock_rebound = 9;
                    } else {
                        shock_psi = Math.floor(weight * 2.65);
                        shock_rebound = 6;
                    }
                    
                    if (style === "Soft Trails") {
                        shock_psi -= 14;
                        shock_rebound += 1;
                    } else if (style === "Jumps") {
                        shock_psi += 22;
                        shock_rebound -= 2;
                    } else if (style === "Fast Downhill") {
                        shock_psi += 12;
                        shock_rebound -= 1;
                    } else if (style === "Dirt Jump") {
                        shock_psi = Math.max(shock_psi + 40, 230);
                        shock_rebound = Math.max(shock_rebound - 3, 2);
                    } else if (style === "Enduro") {
                        shock_psi += 6;
                    }
                    
                    let shock_bars = (shock_psi * 0.0689476).toFixed(2);

                    shockHTML = `
                        <div class="p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="font-bold text-sky-400 text-xs uppercase tracking-wider">Rear Shock Setup (${bike.shock_brand})</h4>
                                <span class="text-[10px] font-mono bg-sky-950 text-sky-400 px-1.5 py-0.5 rounded border border-sky-900">AIR SHOCK</span>
                            </div>
                            <ul class="text-xs space-y-1.5 text-slate-300 font-mono">
                                <div class="flex justify-between border-b border-slate-800/40 pb-1">
                                    <span class="text-slate-500">Suggested Pressure:</span>
                                    <span class="text-white font-bold">${shock_psi} PSI <span class="text-slate-400 text-[10px]">(${shock_bars} Bar)</span></span>
                                </div>
                                <div class="flex justify-between pt-0.5">
                                    <span class="text-slate-500">Rebound Setting:</span>
                                    <span class="text-white font-bold">${shock_rebound} Clicks <span class="text-[10px] text-slate-400">(From fully slow/closed)</span></span>
                                </div>
                            </ul>
                        </div>
                    `;
                } else {
                    const travel = parseFloat(bike.travel_val || 160);
                    const stroke = parseFloat(bike.stroke_val || 65);
                    const leverage_ratio = travel / stroke;
                    
                    let rider_lbs = user_data.weight_unit === "lbs" ? user_data.weight_value : user_data.weight_value * 2.20462;
                    let baseline_spring = (rider_lbs * leverage_ratio * 0.70) / (stroke / 25.4 * 0.28);
                    
                    if (style.includes("Jumps") || style.includes("Freeride")) {
                        baseline_spring *= 1.08;
                    } else if (style.includes("Soft Trails")) {
                        baseline_spring *= 0.94;
                    } else if (style.includes("Dirt Jump")) {
                        baseline_spring *= 1.30;
                    }
                    
                    let standard_rate = Math.round(baseline_spring / 25) * 25;
                    if (standard_rate < 150) standard_rate = 150;

                    shockHTML = `
                        <div class="p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="font-bold text-sky-400 text-xs uppercase tracking-wider">Rear Shock Setup (${bike.shock_brand})</h4>
                                <span class="text-[10px] font-mono bg-amber-950/40 text-amber-400 px-1.5 py-0.5 rounded border border-amber-900/30">COIL SHOCK</span>
                            </div>
                            <ul class="text-xs space-y-1.5 text-slate-300 font-mono">
                                <div class="flex justify-between border-b border-slate-800/40 pb-1">
                                    <span class="text-slate-500">Recommended Coil Spring:</span>
                                    <span class="text-amber-400 font-bold">${standard_rate} lbs/in</span>
                                </div>
                                <div class="flex justify-between border-b border-slate-800/40 pb-1">
                                    <span class="text-slate-500">Frame Leverage Ratio:</span>
                                    <span class="text-white">${leverage_ratio.toFixed(2)} : 1</span>
                                </div>
                                <div class="flex justify-between pt-0.5">
                                    <span class="text-slate-500">Spring Preload:</span>
                                    <span class="text-white font-bold">1 to 1.5 Turns</span>
                                </div>
                            </ul>
                        </div>
                    `;
                }
            }

            const html = `
                <div class="flex flex-col h-full flex-1 justify-between">
                    <div class="space-y-4">
                        <div class="text-center">
                            <h2 class="text-xl font-black uppercase text-white tracking-tight">${bike.name} Setup</h2>
                            <p class="text-[11px] font-mono text-slate-500 uppercase tracking-wider">Tuned for ${style}</p>
                        </div>
                        
                        ${bike.image_data ? `
                            <div class="w-44 h-28 mx-auto bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-inner">
                                <img src="${bike.image_data}" class="w-full h-full object-cover">
                            </div>
                        ` : ''}

                        <div class="p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="font-bold text-blue-500 text-xs uppercase tracking-wider">Front Fork Setup (${bike.fork_brand})</h4>
                                <span class="text-[10px] font-mono bg-blue-950 text-blue-400 px-1.5 py-0.5 rounded border border-blue-900">AIR FORK</span>
                            </div>
                            <ul class="text-xs space-y-1.5 text-slate-300 font-mono">
                                <div class="flex justify-between border-b border-slate-800/40 pb-1">
                                    <span class="text-slate-500">Suggested Pressure:</span>
                                    <span class="text-white font-bold">${fork_psi} PSI <span class="text-slate-400 text-[10px]">(${fork_bars} Bar)</span></span>
                                </div>
                                <div class="flex justify-between pt-0.5">
                                    <span class="text-slate-500">Rebound Setting:</span>
                                    <span class="text-white font-bold">${fork_rebound} Clicks <span class="text-[10px] text-slate-400">(From fully slow/closed)</span></span>
                                </div>
                            </ul>
                        </div>

                        ${shockHTML}
                    </div>

                    <div class="pt-6">
                        <button onclick="showHomePage()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold uppercase tracking-wider py-3 px-4 rounded-lg transition-colors border border-slate-700 text-xs">
                            &larr; Back to Garage Registry
                        </button>
                    </div>
                </div>
            `;
            renderContainer(html);
        }

        function handleOnboardingSubmit() {
            user_data.age = document.getElementById('onboard-age').value;
            user_data.weight_value = parseInt(document.getElementById('onboard-weight').value);
            user_data.weight_unit = document.getElementById('onboard-unit').value;
            user_data.onboarding_complete = true;
            saveData();
            showHomePage();
        }

        function handleSaveProfileSubmit() {
            user_data.age = document.getElementById('edit-age').value;
            user_data.weight_value = parseInt(document.getElementById('edit-weight').value);
            user_data.weight_unit = document.getElementById('edit-unit').value;
            saveData();
            showHomePage();
        }

        function handleCreateBikeSubmit() {
            const nameInput = document.getElementById('bike-name').value.trim();
            if (!nameInput) {
                alert("Please enter a bike name.");
                return;
            }

            const files = document.getElementById('bike-image').files;
            const frameType = document.getElementById('bike-frame').value;
            
            const newBike = {
                name: nameInput,
                riding_style: document.getElementById('bike-style').value,
                fork_brand: document.getElementById('bike-fork').value,
                frame_type: frameType,
                shock_medium: frameType === "Full Suspension" ? document.getElementById('bike-shock-medium').value : "none",
                shock_brand: frameType === "Full Suspension" ? document.getElementById('bike-shock').value : "None",
                travel_val: frameType === "Full Suspension" ? document.getElementById('bike-travel').value : 0,
                stroke_val: frameType === "Full Suspension" ? document.getElementById('bike-stroke').value : 0,
                image_data: null
            };

            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    newBike.image_data = reader.result;
                    user_data.bikes.push(newBike);
                    saveData();
                    showHomePage();
                }
                reader.readAsDataURL(files);
            } else {
                user_data.bikes.push(newBike);
                saveData();
                showHomePage();
            }
        }

        function handleDeleteBike(index) {
            if (confirm("Delete this bike setup from your garage?")) {
                user_data.bikes.splice(index, 1);
                saveData();
                showHomePage();
            }
        }

        function handleResetApp() {
            if (confirm("Reset the app? This clears all saved bikes and weights.")) {
                localStorage.removeItem(STORAGE_KEY);
                user_data = {
                    onboarding_complete: false,
                    age: "24",
                    weight_value: 75,
                    weight_unit: "kg",
                    bikes: []
                };
                showOnboardingPage();
            }
        }

        window.onload = function() {
            loadData();
            if (user_data.onboarding_complete) {
                showHomePage();
            } else {
                showOnboardingPage();
            }
        };
    </script>
</body>
</html>
